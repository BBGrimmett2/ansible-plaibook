---
# Deterministic tests for Cursor lens-attempt billed usage.
# No live model. Covers the #63 rescue contract:
#   (1) nested execute + usage → pipeline_agent_calls entry
#   (2) parent-only + usage → NOT a lens call (no entry)
#   (3) empty miss + usage → still billed (tokens were spent)
#   (4) ansible.builtin.fail-shaped result → not billed
#   (5) fail_json-shaped nested execute + usage → billed
#
# Usage:
#   ansible-playbook tests/test_cursor_lens_attempt_usage.yml

- name: "Cursor lens-attempt usage: parent-only is not a lens call"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    review_org_repo: "aknochow/ansible-plaibook"
    review_number: "63"
    review_cursor_model: "auto"
    cursor_nonce_lens_label: "Security lens"
    cursor_lens_stats_name: security
    cursor_lens_attempt_number: 1
    _nested_usage:
      input_tokens: 100
      output_tokens: 20
      cache_write_tokens: 0
      cache_read_tokens: 0
      thinking_tokens: 0
      total_tokens: 120
    _parent_usage:
      input_tokens: 999
      output_tokens: 99
      cache_write_tokens: 0
      cache_read_tokens: 0
      thinking_tokens: 0
      total_tokens: 1098
    _miss_usage:
      input_tokens: 40
      output_tokens: 5
      cache_write_tokens: 0
      cache_read_tokens: 0
      thinking_tokens: 0
      total_tokens: 45

  tasks:
    - name: Nested execute with usage must be billed as a lens call
      block:
        - name: Reset billed usage
          ansible.builtin.set_fact:
            pipeline_agent_calls: []

        - name: Append nested-execute usage
          ansible.builtin.include_role:
            name: review
            tasks_from: append_cursor_lens_attempt_usage
          vars:
            cursor_attempt_raw:
              status: finished
              resolved_model: auto
              usage_normalized: "{{ _nested_usage }}"
              structured_tool_calls:
                - name: report_findings
                  caller: nested
                  agent_id:
                  args: {}

        - name: Confirm nested execute was billed
          ansible.builtin.assert:
            that:
              - pipeline_agent_calls | length == 1
              - pipeline_agent_calls[0].lens == "security"
              - pipeline_agent_calls[0].usage.input_tokens | int == 100
              - pipeline_agent_calls[0].attempt | int == 1
            fail_msg: "Nested execute with usage must append a lens call."
            success_msg: "Nested execute billed as a lens call."

    - name: Parent-only execute with usage must not be billed as a lens call
      block:
        - name: Reset billed usage before parent-only
          ansible.builtin.set_fact:
            pipeline_agent_calls: []

        - name: Append parent-only usage
          ansible.builtin.include_role:
            name: review
            tasks_from: append_cursor_lens_attempt_usage
          vars:
            cursor_attempt_raw:
              failed: true
              msg: "Cursor run finished with status error (run_id=run-1)"
              status: error
              resolved_model: auto
              usage_normalized: "{{ _parent_usage }}"
              structured_tool_calls:
                - name: report_findings
                  caller: parent
                  agent_id: parent-1
                  args:
                    findings: []
                    scores: { security: 99 }

        - name: Confirm parent-only was not billed
          ansible.builtin.assert:
            that:
              - pipeline_agent_calls | length == 0
            fail_msg: >-
              Parent-only failed return must not land in pipeline_agent_calls.
              Got {{ pipeline_agent_calls | length }} entries.
            success_msg: "Parent-only execute is not billed as a lens call."

    - name: Empty miss with usage must still be billed
      block:
        - name: Reset billed usage before empty miss
          ansible.builtin.set_fact:
            pipeline_agent_calls: []

        - name: Append empty-miss usage
          ansible.builtin.include_role:
            name: review
            tasks_from: append_cursor_lens_attempt_usage
          vars:
            cursor_attempt_raw:
              status: error
              resolved_model: auto
              usage_normalized: "{{ _miss_usage }}"
              structured_tool_calls: []

        - name: Confirm empty miss was billed
          ansible.builtin.assert:
            that:
              - pipeline_agent_calls | length == 1
              - pipeline_agent_calls[0].usage.input_tokens | int == 40
              - pipeline_agent_calls[0].lens == "security"
            fail_msg: "An empty miss with usage must still be billed."
            success_msg: "Empty miss billed; tokens were spent."

    - name: A non-module fail must not be billed
      block:
        - name: Reset billed usage before non-module fail
          ansible.builtin.set_fact:
            pipeline_agent_calls: []

        - name: Append ansible.builtin.fail-shaped result
          ansible.builtin.include_role:
            name: review
            tasks_from: append_cursor_lens_attempt_usage
          vars:
            cursor_attempt_raw:
              failed: true
              msg: "named lens did not bind"

        - name: Confirm non-module fail was not billed
          ansible.builtin.assert:
            that:
              - pipeline_agent_calls | length == 0
            fail_msg: "ansible.builtin.fail must not append a lens call."
            success_msg: "Non-module fail is not billed."

    - name: Failed module return with nested execute must be billed
      block:
        - name: Reset billed usage before nested fail_json
          ansible.builtin.set_fact:
            pipeline_agent_calls: []

        - name: Append fail_json-shaped nested usage
          ansible.builtin.include_role:
            name: review
            tasks_from: append_cursor_lens_attempt_usage
          vars:
            cursor_attempt_raw:
              failed: true
              msg: "Cursor run finished with status error (run_id=run-1)"
              status: error
              resolved_model: auto
              usage_normalized: "{{ _nested_usage }}"
              structured_tool_calls:
                - name: report_findings
                  caller: nested
                  agent_id:
                  args: {}

        - name: Confirm nested fail_json was billed
          ansible.builtin.assert:
            that:
              - pipeline_agent_calls | length == 1
              - pipeline_agent_calls[0].usage.input_tokens | int == 100
              - pipeline_agent_calls[0].model == "auto"
            fail_msg: "A fail_json-shaped nested execute must still be billed."
            success_msg: "Nested execute billed from a failed module return."
