name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies with lockfile
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run ruff lint check
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Cache Ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/plaibook-collections
          key: collections-${{ runner.os }}-${{ hashFiles('collections-requirements.yml', 'scripts/ci-install-collections.py') }}

      - name: Install required collections
        env:
          GIT_TERMINAL_PROMPT: "0"
          GITHUB_TOKEN: ${{ github.token }}
          PLAIBOOK_COLLECTIONS_DEST: ${{ runner.temp }}/plaibook-collections
        run: |
          dest="${PLAIBOOK_COLLECTIONS_DEST}"
          mkdir -p "$dest"
          echo "ANSIBLE_COLLECTIONS_PATH=${dest}" >> "$GITHUB_ENV"
          uv run --python "${{ matrix.python-version }}" python scripts/ci-install-collections.py

      - name: Run ansible-lint check
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/plaibook-collections
        run: uv run --python ${{ matrix.python-version }} ansible-lint --offline

      - name: Check playbook syntax
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/plaibook-collections
        run: uv run --python ${{ matrix.python-version }} ansible-playbook review.yml --syntax-check

      - name: Run pytest test suite
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/plaibook-collections
        run: uv run --python ${{ matrix.python-version }} pytest -v --tb=short

      - name: Run offline Ansible playbook tests
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/plaibook-collections
        run: uv run --python ${{ matrix.python-version }} ./scripts/run_playbook_tests.sh

  # Same lockfile audit collections inherit via collection-ci.yml. OSV over
  # uv.lock so the job fails on known-vulnerable pins CI would actually install.
  # Inline action (not nested reusable): `upload-sarif: false` on the Google
  # reusable caused a workflow startup_failure. Docker scanner exits non-zero
  # on vulns; no SARIF / security-events write.
  lockfile-audit:
    name: Lockfile audit (OSV)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Scan locked uv.lock with OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=uv.lock
