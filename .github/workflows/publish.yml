name: Publish to PyPI

# First release: create a pending trusted publisher on PyPI, add a GitHub
# environment named `pypi`, merge this workflow, then publish a GitHub Release.
# Do not store a PyPI API token. The workflow filename (`publish.yml`) is
# load-bearing — it must match the pending publisher exactly.

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build sdist and wheel
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Release tag must match pyproject version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_bytes())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          expected = "v" + version
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} must be {expected!r}")
          print("tag ok", tag)
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python
        run: uv python install 3.12

      - name: Build
        run: uv build

      - name: Wheel must vendor review.yml
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheels = list(Path("dist").glob("plaibook-*.whl"))
          sdists = list(Path("dist").glob("plaibook-*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist in dist/: {list(Path('dist').iterdir())}")
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
          if "plaibook/share/review.yml" not in names:
              raise SystemExit("wheel is missing plaibook/share/review.yml")
          if "plaibook/share/ansible.cfg" not in names:
              raise SystemExit("wheel is missing plaibook/share/ansible.cfg")
          if "plaibook/share/collections-requirements.yml" not in names:
              raise SystemExit("wheel is missing plaibook/share/collections-requirements.yml")
          with tarfile.open(sdists[0], "r:gz") as tf:
              members = tf.getnames()
          if not any(name.endswith("/review.yml") for name in members):
              raise SystemExit("sdist is missing review.yml")
          print("vendored playbook ok:", wheels[0].name)
          PY

      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/plaibook
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
