---
# Cursor branch of the continuity audit. Included only when
# agent_family=cursor so a Gemini/Vertex run does not parse
# aknochow.cursor.agent.
- name: "Cursor: call Cursor via the Agent SDK to independently audit the continuity claim"
  aknochow.cursor.agent:
    api_key: "{{ review_cursor_api_key }}"
    prompt: >-
      Spawn the continuity_audit_lens subagent with the Task /
      Subagent tool. You must call the Task / Subagent tool --
      continuity_audit_lens is not itself a tool. Do not judge the
      claim yourself. Do not call report_continuity_audit yourself.
      Wait for continuity_audit_lens to finish.
    model: "{{ review_verify_cursor_model }}"
    effort: "{{ review_cursor_effort }}"
    cwd: "{{ review_repo_path }}"
    setting_sources: []
    tools: [mcp, task]
    agents:
      continuity_audit_lens:
        description: Independent continuity-claim auditor with trusted instructions.
        prompt: "{{ _continuity_audit_prompt }}"
    structured_tool:
      name: report_continuity_audit
      description: Report whether a continuity claim between two findings is plausible.
      input_schema: "{{ continuity_audit_schema }}"
  register: _continuity_audit_cursor_result

- name: "Cursor: consume Continuity-audit named-lens execute"
  ansible.builtin.include_tasks: select_cursor_named_lens.yml
  vars:
    cursor_raw: "{{ _continuity_audit_cursor_result }}"
    cursor_nonce_lens_label: "Continuity audit"
    cursor_lens_tool: report_continuity_audit
    cursor_named_lens_required: true

- name: "Cursor: fail closed if the Continuity-audit named lens nonce mismatches"
  when: cursor_named_lens_present | default(false) | bool
  ansible.builtin.include_tasks: assert_cursor_prompt_nonce.yml
  vars:
    cursor_nonce_structured: "{{ cursor_lens_structured }}"
    cursor_nonce_lens_label: "Continuity audit"

- name: "Cursor: normalize the continuity audit result"
  ansible.builtin.set_fact:
    _continuity_audit_resolved_model: "{{ _continuity_audit_cursor_result.resolved_model | default(review_verify_cursor_model) }}"
    _continuity_audit_usage_normalized: "{{ _continuity_audit_cursor_result.usage_normalized }}"
    _continuity_audit_answered: "{{ cursor_named_lens_present | default(false) | bool }}"
    _continuity_audit_verdict: "{{ (cursor_lens_structured | default({})).verdict | default('') }}"
    _continuity_audit_rationale: "{{ (cursor_lens_structured | default({})).rationale | default('') }}"
