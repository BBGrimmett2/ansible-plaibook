---
# Append one Cursor lens attempt to pipeline_agent_calls.
#
# pipeline_agent_calls is billed named-lens usage, not the bind. Bind is
# nested execute only (select_cursor_named_lens.yml). A parent-only
# return (parent execute, no nested execute) is dispatch fabrication
# (GetDynamicTools / parent last-call) and must not be stored as a lens
# call — that contradicts the bind contract and inflates billed usage.
#
# Empty misses (no execute at all) and nested executes still count:
# those attempts spent tokens on the named lens dispatch. A miss used
# to abort the play and zero last_run cost, including a sibling that
# already bound.
#
# Skip non-module failures (ansible.builtin.fail from bind/assert):
# those have no usage_normalized / status / structured_tool_calls.
#
# Vars: cursor_attempt_raw (module result or ansible_failed_result),
# cursor_nonce_lens_label, cursor_lens_stats_name,
# cursor_lens_attempt_number, review_org_repo, review_number,
# review_cursor_model

- name: "Cursor: append {{ cursor_nonce_lens_label }} attempt usage unless parent-only"
  when:
    - cursor_attempt_raw.usage_normalized is defined or cursor_attempt_raw.status is defined or cursor_attempt_raw.structured_tool_calls is defined
    - (cursor_attempt_raw.structured_tool_calls | default([]) | selectattr('caller', 'equalto', 'nested') | list | length) > 0 or (cursor_attempt_raw.structured_tool_calls | default([]) | selectattr('caller', 'equalto', 'parent') | list | length) == 0
  ansible.builtin.set_fact:
    pipeline_agent_calls: >-
      {{ (pipeline_agent_calls | default([])) + [{
           'target': review_org_repo + '#' + review_number,
           'lens': cursor_lens_stats_name,
           'model': cursor_attempt_raw.resolved_model | default(review_cursor_model),
           'usage': cursor_attempt_raw.usage_normalized | default({}),
           'attempt': cursor_lens_attempt_number | int
         }] }}
