---
# Consume one Cursor named-lens attempt. Missing nested execute,
# parent-only execute, and nonce mismatch are invalid attempts
# (block/rescue), not play abort. Parent last-call never counts as a
# bind. Do not print .text or payloads in fail_msg.
#
# Security/Review wrap this in dispatch_cursor_lens_attempt.yml and
# retry with review_structured_output_max_attempts. Explore/verify
# mid-turns keep calling select_cursor_named_lens.yml directly
# (required false; parent-only still fails closed there).
#
# Vars:
#   cursor_raw: module result
#   cursor_nonce_lens_label: human label
#   cursor_lens_tool: structured tool name
#   cursor_lens_valid_var: fact name to set true/false
#   cursor_lens_args_var: fact name for nested args on success
#   cursor_lens_fail_var: fact name for the last trust/I/O fail_msg
#
# Sets:
#   {{ cursor_lens_valid_var }}
#   {{ cursor_lens_args_var }} on success
#   {{ cursor_lens_fail_var }} on rescue (trust fail_msg, no drafts)

- name: "Cursor: bind {{ cursor_nonce_lens_label }} named-lens execute (attempt)"
  block:
    - name: "Cursor: consume {{ cursor_nonce_lens_label }} named-lens execute"
      ansible.builtin.include_tasks: select_cursor_named_lens.yml
      vars:
        cursor_named_lens_required: true

    - name: "Cursor: fail closed if the {{ cursor_nonce_lens_label }} named lens nonce mismatches"
      ansible.builtin.include_tasks: assert_cursor_prompt_nonce.yml
      vars:
        cursor_nonce_structured: "{{ cursor_lens_structured }}"

    - name: "Cursor: remember {{ cursor_nonce_lens_label }} named-lens args"
      ansible.builtin.set_fact:
        "{{ cursor_lens_args_var }}": "{{ cursor_lens_structured }}"
        "{{ cursor_lens_valid_var }}": true
  rescue:
    - name: "Cursor: mark {{ cursor_nonce_lens_label }} attempt unbound"
      ansible.builtin.set_fact:
        "{{ cursor_lens_valid_var }}": false
        "{{ cursor_lens_fail_var }}": "{{ ansible_failed_result.msg | default('named lens did not bind') }}"
